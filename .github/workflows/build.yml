name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A new push cancels an older run that is still going, so minutes are not wasted
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Keeps the same debug signature between builds so the APK installs as an update
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|Unresolved|Could not" -A3 build.log | head -80 || true
          else
            echo "No build.log: the job failed before Gradle started. Check the earlier steps."
          fi

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WM-CMPRSS.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WM-CMPRSS.apk --title "Latest build" --notes "Commit ${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: WM-CMPRSS-debug
          path: WM-CMPRSS.apk
