name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Keeps the same debug signature between builds so the APK installs as an update
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WM-CMPRSS.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WM-CMPRSS.apk --title "Latest build" --notes "Commit ${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: WM-CMPRSS-debug
          path: WM-CMPRSS.apk
